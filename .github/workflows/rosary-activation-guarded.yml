name: rosary-activation-guarded
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/rosary-activation-guarded.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  PACKET: ''
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0990963579de1670f3a084a2137fab68cae43615
          fetch-depth: 0
      - name: Apply exact packet and scope guard
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PACKET" | base64 -d | gunzip > /tmp/activation.patch
          echo 'a8a9aaddbad0e35b6c92108bd5238805c27fb54fc3bb50c7b26664def8b3e415  /tmp/activation.patch' | sha256sum -c -
          git apply /tmp/activation.patch
          git add -A
          git diff --cached --name-only | tee /tmp/changed.txt
          python3 - <<'GUARD'
          import re,subprocess
          files=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'locales/rosary-books-pairing.json','same-page-manifest.js','same-page-resolver.js','scripts/books/build-rosary-control.py','scripts/books/build-rosary-pairing.py','scripts/i18n/reviewed_rosary_books.py','scripts/i18n/same_page_injection.py','scripts/qa/run_full_qa.sh','scripts/qa/test_rosary_books_pairing.py','scripts/tests/rosary_books_click_preview.cjs','scripts/tests/same_page_rosary_books.cjs'}
          assert len(files)==171, len(files)
          assert all(f in allowed or re.fullmatch(r'(?:(?:ar|de|es|fr|it|pl|pt)/)?(?:joyful|luminous|sorrowful|glorious)-[a-z-]+\.html',f) for f in files)
          GUARD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: activate scoped rosary language pairing pending live click'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: pip install -r scripts/qa/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/qa/run_full_qa.sh --ci --shard ${{ matrix.shard }}/8 --skip-i18n-test
        env:
          CI: '1'
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0990963579de1670f3a084a2137fab68cae43615
          fetch-depth: 0
      - name: Apply exact packet and scope guard
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PACKET" | base64 -d | gunzip > /tmp/activation.patch
          echo 'a8a9aaddbad0e35b6c92108bd5238805c27fb54fc3bb50c7b26664def8b3e415  /tmp/activation.patch' | sha256sum -c -
          git apply /tmp/activation.patch
          git add -A
          git diff --cached --name-only | tee /tmp/changed.txt
          python3 - <<'GUARD'
          import re,subprocess
          files=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'locales/rosary-books-pairing.json','same-page-manifest.js','same-page-resolver.js','scripts/books/build-rosary-control.py','scripts/books/build-rosary-pairing.py','scripts/i18n/reviewed_rosary_books.py','scripts/i18n/same_page_injection.py','scripts/qa/run_full_qa.sh','scripts/qa/test_rosary_books_pairing.py','scripts/tests/rosary_books_click_preview.cjs','scripts/tests/same_page_rosary_books.cjs'}
          assert len(files)==171, len(files)
          assert all(f in allowed or re.fullmatch(r'(?:(?:ar|de|es|fr|it|pl|pt)/)?(?:joyful|luminous|sorrowful|glorious)-[a-z-]+\.html',f) for f in files)
          GUARD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: activate scoped rosary language pairing pending live click'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: pip install -r scripts/qa/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Extra gates and exact scoped preview
        env:
          CI: '1'
        run: |
