name: Rosary unpublished successor checkpoint 2
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/rosary-successor-checkpoint-nov11.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/rosary-story-successor-nov11
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 lxml
      - name: Apply exact unpublished checkpoint and validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/stage | cut -f1)" = '5c4a38d2643e962a540700b5d1db9b9bc2b7cc69'
          test "$(git rev-parse HEAD)" = '67c6e415c787f74870758e31aed9bdb979a2a001'
          python3 - <<'PYDATA'
          import base64,gzip,hashlib
          from pathlib import Path
          data=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest()=='a39792e97aab41fb313aa0532dca42ea011bea3e77e886d625381e768b7424c6'
          Path('/tmp/successor.patch').write_bytes(data)
          PYDATA
          git config user.name 'jnrahme'
          git config user.email 'jnrahme@users.noreply.github.com'
          git am /tmp/successor.patch
          python3 - <<'PYFILES'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only','67c6e415c787f74870758e31aed9bdb979a2a001','HEAD'],text=True).splitlines())
          expected={'docs/rosary-successor/illustration-notes-all8.json', 'docs/rosary-successor/README.md', 'docs/rosary-successor/locale-metadata-field-packet-v2.json', 'scripts/i18n/rosary_successor_adapter.py', 'docs/rosary-successor/arabic-metadata-chrome-v6.json', 'docs/rosary-successor/painting-alt-corrections.json', 'docs/rosary-successor/neutral-prayer-plate.svg', 'scripts/qa/test_rosary_books_pairing.py'}
          assert paths==expected, paths
          PYFILES
          python3 -m unittest discover -s scripts/qa -p test_rosary_books_pairing.py
          git diff --check HEAD^
          git push origin HEAD:refs/heads/review/rosary-story-successor-nov11
          git rev-parse HEAD
