name: Rosary unpublished successor checkpoint
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/rosary-successor-checkpoint-nov11.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c4a38d2643e962a540700b5d1db9b9bc2b7cc69
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 lxml
      - name: Apply exact unpublished checkpoint and validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/stage | cut -f1)" = '5c4a38d2643e962a540700b5d1db9b9bc2b7cc69'
          test -z "$(git ls-remote origin refs/heads/review/rosary-story-successor-nov11)"
          python3 - <<'PYDATA'
          import base64,gzip,hashlib
          from pathlib import Path
          data=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest()=='44849017d4ea10f329b9b9976a3e79c0d120b840094318f3596429d18fd6c7d5'
          Path('/tmp/successor.patch').write_bytes(data)
          PYDATA
          git config user.name 'jnrahme'
          git config user.email 'jnrahme@users.noreply.github.com'
          git am /tmp/successor.patch
          python3 - <<'PYFILES'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          expected={'docs/rosary-successor/README.md','docs/rosary-successor/integration-spec-v1.json','docs/rosary-successor/twenty-en-candidates-v3.json','scripts/i18n/rosary_successor_adapter.py','scripts/i18n/rosary_successor_review.py','scripts/qa/test_rosary_books_pairing.py'}
          assert paths==expected, paths
          PYFILES
          python3 -m unittest discover -s scripts/qa -p test_rosary_books_pairing.py
          git diff --check HEAD^
          git push origin HEAD:refs/heads/review/rosary-story-successor-nov11
          git rev-parse HEAD
