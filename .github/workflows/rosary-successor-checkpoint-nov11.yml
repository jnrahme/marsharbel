name: MAR170 unpublished branch checkpoint
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/rosary-successor-checkpoint-nov11.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage
          fetch-depth: 1
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '5c4a38d2643e962a540700b5d1db9b9bc2b7cc69'
          git checkout -b content/mar170-novena-anchor
          python3 - <<'PYDATA'
          import base64,hashlib
          from pathlib import Path
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest()=='991cd75a3dc780a169037e380ef6d86e819b700dbc4e042c757dbebf7c8ed7c6'
          Path('/tmp/mar170.patch').write_bytes(data)
          PYDATA
          git apply --index /tmp/mar170.patch
          python3 - <<'PYFILES'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert paths=={'src/pages/saint-charbel-prayer-for-healing.html','saint-charbel-prayer-for-healing.html'},paths
          PYFILES
          git config user.name 'jnrahme'
          git config user.email 'jnrahme@users.noreply.github.com'
          git commit -m 'fix(content): land healing CTA at nine-day novena instructions'
          test "$(git rev-parse HEAD^{tree})" = '590dcc8f40510941c16440dc5044d6b26e4f045e'
          git diff --check HEAD^
          git push origin HEAD:refs/heads/content/mar170-novena-anchor
