name: mar168-battery-nov11
'on':
  push:
    branches:
    - recovery/nov10-write-route
    paths:
    - .github/workflows/mar168-battery-nov11.yml
permissions:
  contents: write
env:
  PACKET0: 
  PACKET1: 
  PACKET2: 
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 7f7f48618aa354e0fbe4e87fd0438fb9ae1f95b5
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - run: 'npm ci

        pip install -r scripts/qa/requirements.txt'
    - name: Normal native generation, no candidate push
      run: 'set -euo pipefail

        printf ''%s'' "$PACKET0" "$PACKET1" "$PACKET2" | base64 -d | gunzip > /tmp/mar168.patch

        echo ''6644765025ad77ba7c9e1b7f52e9865a4366e6d05a2d5f1170356d7a1609f637  /tmp/mar168.patch'' | sha256sum -c -

        git apply /tmp/mar168.patch

        python3 scripts/build_news_desk.py

        node scripts/build-pages.mjs

        python3 scripts/build-international.py

        python3 scripts/build-international.py

        python3 scripts/build_feeds.py

        node scripts/build-search-index.mjs

        python3 scripts/sitemap_lastmod.py --baseline 7f7f48618aa354e0fbe4e87fd0438fb9ae1f95b5

        git add -A

        git diff --cached --binary --full-index > /tmp/mar168-regenerated.patch

        git diff --cached --name-only > /tmp/mar168-regenerated-files.txt

        sha256sum /tmp/mar168-regenerated.patch

        git diff --cached --stat

        python3 scripts/build-international.py --check


        echo ''295b387f5c041a8bc9ce55d2f5f49e92af310a09728243762df914737f64673a  /tmp/mar168-regenerated.patch'' | sha256sum -c -

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mar168-regenerated-review
        path: '/tmp/mar168-regenerated.patch

          /tmp/mar168-regenerated-files.txt'
        if-no-files-found: warn
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 7f7f48618aa354e0fbe4e87fd0438fb9ae1f95b5
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        name: mar168-regenerated-review
