name: Integrate reviewed candidates with green infrastructure
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/rebase-reviewed-candidates.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: stage
      - name: Merge verified current stage into hidden-shop candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d490cf873b51ffa26bdf82ebacb118df90172524
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for pair in 'feat/hidden-shop-link-scaffold:a02705191591f65c0a78482e5a6f2264efa6f153'; do
            branch=${pair%:*}; expected=${pair##*:}
            git fetch origin "$branch"
            test "$(git rev-parse FETCH_HEAD)" = "$expected"
            git checkout -B candidate FETCH_HEAD
            git merge --no-edit d490cf873b51ffa26bdf82ebacb118df90172524
            git merge-base --is-ancestor d490cf873b51ffa26bdf82ebacb118df90172524 HEAD
            git push origin HEAD:refs/heads/$branch
            git rev-parse HEAD
          done
