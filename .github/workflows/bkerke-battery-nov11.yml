        python3 -m unittest discover -s scripts/qa -p test_rosary_guide_certification.py

        node scripts/tests/same_page_rosary_books.cjs

        node scripts/tests/same_page_ar2_pairing.cjs

        node scripts/tests/same_page_resolver.cjs

        node scripts/tests/same_page_enabled_navigation.cjs

        node scripts/build-pages.mjs --check

        python3 scripts/qa/check_new_page_locales.py --base fdcd0efcf60ee970cbf4bc4eb8e4d36a1e48f6d8

        node scripts/ci/check_bq_shard_lists.mjs

        mkdir -p /downloads && chmod 777 /downloads



        python3 -m unittest scripts.qa.test_film_master_family

        python3 -m unittest scripts.qa.test_shard_manifest

        python3 scripts/qa/test_film_master_family.py

        python3 scripts/qa/test_shard_manifest.py

        python3 scripts/sitemap_lastmod.py --check

        python3 scripts/build_feeds.py --check

        node scripts/build-search-index.mjs --check


        python3 -m unittest scripts.qa.test_news_desk

        python3 scripts/qa/test_news_desk.py

        '
