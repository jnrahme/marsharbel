name: Search index daily regeneration

# Ruling (Main, Oct 15 2026 21:57 ET on #830, option b): the deploy workflow
# cannot change served bytes because Hostinger pulls stage, so the daily
# search-index refresh lands through the merge train. This bot regenerates
# search-index/<locale>.json from the committed site and keeps ONE reused
# draft PR open against stage; the normal Scrum gate + green CI + GO merges
# it. It never merges anything.
#
# Head-CI path (GITHUB_TOKEN only, no new secrets/access): per the GitHub
# Actions docs, this token's push events never start workflows, and its
# pull_request opened/synchronize/reopened events create runs in an
# approval-required (action_required) state - the same state promote PR #559's
# runs sit in. Internal Scrum review is NOT GitHub's approval click, and no
# human clicker is assumed: after creating/updating its PR, this workflow
# approves its own PR runs through the Actions API
# (POST /actions/runs/<id>/approve, permission actions:write), which starts
# them. Stage branch protection still requires qa, browser-quality and
# dead-code green on the exact head before merge; the train's Scrum gate +
# GO still decides merging. If GitHub ever refuses the GITHUB_TOKEN approval
# call, the automation is explicitly blocked at that step and the run log
# says so - it fails open (regeneration/PR still land) and the gate reports
# red/pending checks, never a silent merge. workflow_dispatch is documented
# to always create runs even from GITHUB_TOKEN; it is exposed here for manual
# regeneration but is not the head-CI mechanism (dispatched QA runs would
# duplicate the PR-event checks under racing names).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write  # approve this bot's own PR workflow runs (action_required)

concurrency:
  group: search-index-daily
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage
          fetch-depth: 0

      - name: Regenerate search indexes
        run: node scripts/build-search-index.mjs

      # Fail closed: a regeneration that does not pass its own --check never
      # reaches a PR. The merge train re-runs the same check in CI.
      - name: Verify regenerated indexes
        run: node scripts/build-search-index.mjs --check

      - name: Create or update the single regeneration PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- search-index/; then
            echo "Search index already current; nothing to PR."
            exit 0
          fi
          BRANCH="bot/search-index-daily"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add search-index/
          git commit -m "chore: daily search-index regeneration $(date -u +%F)"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "$BRANCH $(git rev-parse HEAD)" > /tmp/bot-head.txt
          OPEN=$(gh pr list --base stage --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            echo "Regeneration PR #$OPEN already open; branch updated to the latest regeneration."
            exit 0
          fi
          gh pr create --draft --base stage --head "$BRANCH" \
            --title "chore: daily search-index regeneration ($(date -u +%F))" \
            --body "Automated daily regeneration of search-index/<locale>.json via node scripts/build-search-index.mjs (ruling Oct 15 21:57 ET, option b). One PR is reused; its branch tracks the latest regeneration. Merges through the normal merge train (Scrum gate + green CI + GO); this bot never merges."

      # GITHUB_TOKEN PR runs are created action_required. Approve our own so
      # head CI actually runs; no human click assumed. Fail-open by design:
      # if approval is refused or runs are not found, the PR still exists and
      # the gate sees pending/action_required checks - blocked, never silent.
      - name: Approve own PR workflow runs
        if: always()
        run: |
          [ -f /tmp/bot-head.txt ] || { echo "no regeneration commit this run; nothing to approve"; exit 0; }
          HEAD_SHA=$(cut -d' ' -f2 /tmp/bot-head.txt)
          for i in $(seq 1 12); do
            IDS=$(gh api "repos/${{ github.repository }}/actions/runs?branch=bot/search-index-daily&event=pull_request&status=action_required" \
              --jq ".workflow_runs[] | select(.head_sha==\"${HEAD_SHA}\") | .id" 2>/dev/null || true)
            [ -n "$IDS" ] && break
            sleep 10
          done
          if [ -z "${IDS:-}" ]; then
            echo "BLOCKED: no action_required runs found for $HEAD_SHA - head CI awaits an approval path"
            exit 0
          fi
          for id in $IDS; do
            if gh api -X POST "repos/${{ github.repository }}/actions/runs/${id}/approve" >/dev/null 2>&1; then
              echo "approved run $id"
            else
              echo "BLOCKED: approval refused for run $id - head CI awaits an approval path"
            fi
          done
