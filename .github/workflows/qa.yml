name: QA
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qa-shard:
    name: qa-shard (${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: npm ci
    - name: Verify pinned preinstalled Chromium and system dependencies
      run: "node - <<'JS'\nconst fs = require('node:fs');\nconst { chromium } = require('@playwright/test');\nif (require('@playwright/test/package.json').version !== '1.63.0') throw new Error('Playwright image/package version mismatch');\nif (!fs.existsSync(chromium.executablePath())) throw new Error('Preinstalled Chromium missing');\n(async () => {\n  const browser = await chromium.launch({ headless: true });\n  const page = await browser.newPage();\n  await page.setContent('<html><body>Browser dependency probe</body></html>');\n  if (await page.textContent('body') !== 'Browser dependency probe') throw new Error('Browser launch/render failed');\n  await browser.close();\n})().catch(error => { console.error(error); process.exit(1); });\nJS"
    - name: Install Python dependencies
      run: pip install -r scripts/qa/requirements.txt
    - name: Run QA suite shard
      run: bash scripts/qa/run_full_qa.sh --ci --shard ${{ matrix.shard }}/8 --skip-i18n-test
    - name: Upload step timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa-step-timings-${{ matrix.shard }}
        path: tmp/qa-step-timings.tsv
        if-no-files-found: ignore
    - name: Upload debug artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qa-debug-artifacts-${{ matrix.shard }}
        path: 'tmp/

          test-results/

          output/playwright/

          '
        if-no-files-found: ignore
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
  qa-gates:
    name: qa-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_TIMINGS_FILE: tmp/ci-timings-qa-gates.tsv
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Test deployment verification
      run: bash scripts/ci/timed.sh "Test deployment verification" python3 -m unittest discover -s scripts/qa -p 'test_verify_deployment.py'
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: bash scripts/ci/timed.sh "Install dependencies (npm ci)" npm ci
    - name: Verify pinned preinstalled Chromium and system dependencies
      run: "node - <<'JS'\nconst fs = require('node:fs');\nconst { chromium } = require('@playwright/test');\nif (require('@playwright/test/package.json').version !== '1.63.0') throw new Error('Playwright image/package version mismatch');\nif (!fs.existsSync(chromium.executablePath())) throw new Error('Preinstalled Chromium missing');\n(async () => {\n  const browser = await chromium.launch({ headless: true });\n  const page = await browser.newPage();\n  await page.setContent('<html><body>Browser dependency probe</body></html>');\n  if (await page.textContent('body') !== 'Browser dependency probe') throw new Error('Browser launch/render failed');\n  await browser.close();\n})().catch(error => { console.error(error); process.exit(1); });\nJS"
    - name: Install Python dependencies
      run: bash scripts/ci/timed.sh "Install Python dependencies (pip)" pip install -r scripts/qa/requirements.txt
    - name: New-page locale key gate tests
      run: bash scripts/ci/timed.sh "New-page locale key gate tests" python3 -m unittest discover -s scripts/qa -p 'test_new_page_locales.py'
    - name: New-page locale key coverage (PR base)
      if: github.event_name == 'pull_request'
      env:
        LOCALE_GATE_BASE: ${{ github.event.pull_request.base.sha }}
      run: bash scripts/ci/timed.sh "New-page locale key coverage (PR base)" python3 scripts/qa/check_new_page_locales.py --base "$LOCALE_GATE_BASE"
    - name: Russian first-slice publication and browser guards
      run: 'bash scripts/ci/timed.sh "Russian first-slice unit tests" python3 -m unittest discover -s scripts/qa -p ''test_russian_slice.py''

        bash scripts/ci/timed.sh "Russian first-slice playwright guards" npx playwright test tests/russian-first-slice.spec.js --project=small-phone --project=phone --project=laptop --workers=2

        '
    - name: Clean-checkout page build is in sync
      run: bash scripts/ci/timed.sh "Clean-checkout page build --check" node scripts/build-pages.mjs --check
    - name: Shard manifest completeness
      run: bash scripts/ci/timed.sh "Shard manifest completeness" python3 -m unittest discover -s scripts/qa -p 'test_shard_manifest.py'
    - name: Deploy admission tests
      run: bash scripts/ci/timed.sh "Deploy admission tests" python3 -m unittest discover -s scripts/qa -p 'test_deploy_admission.py'
    - name: Step timings summary
      if: always()
      run: bash scripts/ci/print_timings.sh "qa-gates step timings"
    - name: Upload step timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa-gates-step-timings
        path: tmp/ci-timings-qa-gates.tsv
        if-no-files-found: ignore
    - name: Upload debug artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qa-gates-debug-artifacts
        path: 'tmp/

          test-results/

          output/playwright/

          '
        if-no-files-found: ignore
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
  i18n-test:
    name: i18n-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_TIMINGS_FILE: tmp/ci-timings-i18n-test.tsv
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install dependencies
      run: bash scripts/ci/timed.sh "Install dependencies (npm ci)" npm ci
    - name: Install Python dependencies
      run: bash scripts/ci/timed.sh "Install Python dependencies (pip)" pip install -r scripts/qa/requirements.txt
    - name: i18n unit tests
      run: bash scripts/ci/timed.sh "i18n unit tests (npm run i18n:test)" npm run i18n:test
    - name: Step timings summary
      if: always()
      run: bash scripts/ci/print_timings.sh "i18n-test step timings"
    - name: Upload step timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: i18n-test-step-timings
        path: tmp/ci-timings-i18n-test.tsv
        if-no-files-found: ignore
    - name: Upload debug artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: i18n-test-debug-artifacts
        path: 'tmp/

          test-results/

          '
        if-no-files-found: ignore
  qa:
    if: ${{ always() && !cancelled() }}
    needs:
    - qa-shard
    - qa-gates
    - i18n-test
    runs-on: ubuntu-24.04
    steps:
    - run: 'echo "shards: ${{ needs.qa-shard.result }}"

        echo "gates: ${{ needs.qa-gates.result }}"

        echo "i18n-test: ${{ needs.i18n-test.result }}"

        test "${{ needs.qa-shard.result }}" = "success"

        test "${{ needs.qa-gates.result }}" = "success"

        test "${{ needs.i18n-test.result }}" = "success"

        '
'on':
  push:
    branches:
    - stage
    - main
  pull_request: null
