name: QA

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test deployment verification
        run: python3 -m unittest discover -s scripts/qa -p 'test_verify_deployment.py'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run QA suite
        run: npm run qa:ci

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-debug-artifacts
          path: |
            tmp/
            test-results/
            output/playwright/
          if-no-files-found: ignore
