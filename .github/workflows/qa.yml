name: QA

on:
  push:
    branches:
      - stage
      - main
  pull_request:

# Branch pushes with an open PR were running everything twice (push and pull_request).
# PR branches are covered by pull_request; stage and main by push. A new push to a PR
# cancels that PR's stale run; runs on stage and main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: sitemap lastmod is checked against each page's git history.
          fetch-depth: 0

      - name: Test deployment verification
        run: python3 -m unittest discover -s scripts/qa -p 'test_verify_deployment.py'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Install Python dependencies
        run: pip install beautifulsoup4

      - name: Russian first-slice publication and browser guards
        run: |
          python3 -m unittest discover -s scripts/qa -p 'test_russian_slice.py'
          npx playwright test tests/russian-first-slice.spec.js --project=phone --project=laptop --workers=2

      - name: Run QA suite
        run: npm run qa:ci

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-debug-artifacts
          path: |
            tmp/
            test-results/
            output/playwright/
          if-no-files-found: ignore
