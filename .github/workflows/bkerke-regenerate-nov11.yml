name: Bkerke November12 clean-history draft
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/bkerke-regenerate-nov11.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 30ce682bc81258d04bc47e9e74dd906f1cfad431
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund && pip install -r scripts/qa/requirements.txt
      - name: Generate exact news draft without publishing
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/stage | cut -f1)" = '30ce682bc81258d04bc47e9e74dd906f1cfad431'
          test -z "$(git ls-remote origin refs/heads/content/bkerke-nov12-reviewed)"
          python3 - <<'PYDATA'
          import base64,gzip,hashlib
          from pathlib import Path
          data=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest()=='feff0fe10cb07f820618afa639a18e4d31e505a22536c0ab0153d77e57cdfbf2'
          Path('/tmp/news.patch').write_bytes(data)
          PYDATA
          git config user.name 'jnrahme'
          git config user.email 'jnrahme@users.noreply.github.com'
          git checkout -b content/bkerke-nov12-reviewed
          git apply /tmp/news.patch
          git add -- locales/en/news-desk.json locales/en/news-master-copy.json locales/en/news-master-bindings.json locales/ar/news-master-copy.json news.html src/pages/news.html templates/news-desk/cards.html scripts/qa/test_news_desk.py
          git commit -m 'Add sourced Nov12 Bkerke committee-chair update in English and Arabic'
          python3 scripts/build_news_desk.py
          node scripts/build-pages.mjs
          python3 scripts/build-international.py
          python3 scripts/build-international.py
          python3 scripts/build_feeds.py
          node scripts/build-search-index.mjs
          python3 scripts/sitemap_lastmod.py --baseline 30ce682bc81258d04bc47e9e74dd906f1cfad431
          git diff --check
          git status --short
          git add -u
          if ! git diff --cached --quiet; then git commit -m 'Regenerate news Arabic page and derived search, feeds and sitemap'; fi
          git diff --name-only 30ce682bc81258d04bc47e9e74dd906f1cfad431..HEAD > /tmp/news-files.txt
          git diff --binary --full-index 30ce682bc81258d04bc47e9e74dd906f1cfad431..HEAD > /tmp/news-final.patch
          git rev-parse HEAD HEAD^{tree} > /tmp/news-version.txt
          git push origin HEAD:refs/heads/content/bkerke-nov12-reviewed
      - name: Exact-head freshness and policy gates
        run: |
          set -euo pipefail
          python3 scripts/build-international.py --check
          python3 scripts/qa/check_seo.py
          python3 scripts/qa/check_i18n_policy.py
          node scripts/sync-navigation.mjs --check
          python3 -m unittest discover -s scripts/qa -p test_news_desk.py
          python3 -m unittest discover -s scripts/qa -p test_feeds.py
          node scripts/build-search-index.mjs --check
          node scripts/build-pages.mjs --check
          python3 scripts/build_feeds.py --check
          python3 scripts/sitemap_lastmod.py --check --baseline 30ce682bc81258d04bc47e9e74dd906f1cfad431
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bkerke-nov12-candidate
          path: |
            /tmp/news-final.patch
            /tmp/news-files.txt
            /tmp/news-version.txt
