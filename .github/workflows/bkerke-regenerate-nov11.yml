name: Rebase Saint918 onto reviewed stage
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/bkerke-regenerate-nov11.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/saint-nov12-19-reviewed
          fetch-depth: 0
      - name: Rebase exact held head onto exact current stage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '5c60f1b662739048ad3d15cfbf34bae16ba251b5'
          test "$(git ls-remote origin refs/heads/stage | cut -f1)" = '0a48a5c838016556be3e31608462d2c4c10b009b'
          git fetch origin stage
          git config user.name 'jnrahme'
          git config user.email 'jnrahme@users.noreply.github.com'
          git rebase 0a48a5c838016556be3e31608462d2c4c10b009b
          git merge-base --is-ancestor 0a48a5c838016556be3e31608462d2c4c10b009b HEAD
          git diff --check
          git rev-parse HEAD HEAD^{tree}
          git diff --name-only 0a48a5c838016556be3e31608462d2c4c10b009b..HEAD
          test "$(git ls-remote origin refs/heads/stage | cut -f1)" = '0a48a5c838016556be3e31608462d2c4c10b009b'
          git push --force-with-lease=refs/heads/content/saint-nov12-19-reviewed:5c60f1b662739048ad3d15cfbf34bae16ba251b5 origin HEAD:refs/heads/content/saint-nov12-19-reviewed
