name: news-recovery-corrected-nov11
'on':
  push:
    branches:
    - recovery/nov10-write-route
    paths:
    - .github/workflows/news-recovery-corrected-nov11.yml
permissions:
  contents: read
env:
  PACKET0: 
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 2912e0f60fdc644e39294c1b4b1e1cd49844e264
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - run: 'npm ci

        pip install -r scripts/qa/requirements.txt'
    - name: Native regeneration only, no candidate push
      run: 'set -euo pipefail

        printf ''%s'' "$PACKET0" | base64 -d | gunzip > /tmp/news.patch

        echo ''981b6513294795fecc3f251f88cdedc7953f17b57816b38ab7f57b2ed255df52  /tmp/news.patch'' | sha256sum -c -

        git apply /tmp/news.patch

        python3 scripts/build_news_desk.py

        node scripts/build-pages.mjs

        python3 scripts/i18n/refresh_news_recovery_nov10.py

        python3 scripts/build-international.py

        python3 scripts/build-international.py

        python3 scripts/build_feeds.py

        node scripts/build-search-index.mjs

        python3 scripts/sitemap_lastmod.py --baseline 2912e0f60fdc644e39294c1b4b1e1cd49844e264

        git add -A

        git diff --cached --binary > /tmp/news-regenerated.patch

        git diff --cached --name-only > /tmp/news-regenerated-files.txt

        sha256sum /tmp/news-regenerated.patch

        git diff --cached --stat

        python3 scripts/build_news_desk.py --check

        python3 scripts/i18n/refresh_news_recovery_nov10.py --check

        python3 scripts/build-international.py --check


        python3 scripts/sitemap_lastmod.py --check

        python3 -m unittest scripts.qa.test_news_desk

        python3 scripts/qa/test_news_desk.py

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: news-regenerated-review
        path: '/tmp/news-regenerated.patch

          /tmp/news-regenerated-files.txt'
        if-no-files-found: warn
