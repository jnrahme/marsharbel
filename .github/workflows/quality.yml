name: Browser quality

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/sync-navigation.mjs --check
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run quality
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
