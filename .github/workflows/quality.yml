name: Browser quality

on:
  push:
    branches:
      - stage
      - main
  pull_request:

# Branch pushes with an open PR were running everything twice (push and pull_request).
# PR branches are covered by pull_request; stage and main by push. A new push to a PR
# cancels that PR's stale run; runs on stage and main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/sync-navigation.mjs --check
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run quality
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
