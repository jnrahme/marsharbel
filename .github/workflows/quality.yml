name: Browser quality
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  browser-quality-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - run: node scripts/sync-navigation.mjs --check
    - run: npm ci
    - name: Verify pinned preinstalled Chromium and system dependencies
      run: "node - <<'JS'\nconst fs = require('node:fs');\nconst { chromium } = require('@playwright/test');\nif (require('@playwright/test/package.json').version !== '1.63.0') throw new Error('Playwright image/package version mismatch');\nif (!fs.existsSync(chromium.executablePath())) throw new Error('Preinstalled Chromium missing');\n(async () => {\n  const browser = await chromium.launch({ headless: true });\n  const page = await browser.newPage();\n  await page.setContent('<html><body>Browser dependency probe</body></html>');\n  if (await page.textContent('body') !== 'Browser dependency probe') throw new Error('Browser launch/render failed');\n  await browser.close();\n})().catch(error => { console.error(error); process.exit(1); });\nJS"
    - run: node scripts/ci/check_bq_shard_lists.mjs
    - run: npx playwright test --config playwright.config.cjs --test-list=scripts/ci/bq-shards/shard-${{ matrix.shard }}.txt
    - name: Per-spec Playwright durations
      if: always()
      run: node scripts/ci/summarize_pw_results.mjs output/playwright/pw-results.json output/playwright/pw-spec-timings-${{ matrix.shard }}.tsv
    - name: Upload Playwright timing artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pw-spec-timings-${{ matrix.shard }}
        path: 'output/playwright/pw-results.json

          output/playwright/pw-spec-timings-${{ matrix.shard }}.tsv

          '
        if-no-files-found: ignore
    - if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: browser-quality-artifacts-${{ matrix.shard }}
        path: 'playwright-report/

          test-results/

          '
        if-no-files-found: ignore
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
  browser-quality:
    if: ${{ always() && !cancelled() }}
    needs: browser-quality-shard
    runs-on: ubuntu-24.04
    steps:
    - run: 'echo "shards: ${{ needs.browser-quality-shard.result }}"

        test "${{ needs.browser-quality-shard.result }}" = "success"

        '
'on':
  push:
    branches:
    - stage
    - main
  pull_request: null
