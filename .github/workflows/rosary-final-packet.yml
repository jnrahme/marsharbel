name: Rosary v10 rebase and full review gates
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/rosary-final-packet.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Packet custody and current stage rebase
        run: |
          set -euo pipefail
          cat rosary-v8-*.b64 | base64 -d | xz -dc > /tmp/rosary-v8.patch
          echo '6100b2727228aa768347e65cff019a8541c11f364b8a03377778c6067698a7c4  /tmp/rosary-v8.patch' | sha256sum --check
          git fetch origin stage
          test "$(git rev-parse FETCH_HEAD)" = 8023f924125ddc41b5cf6f843bef4f695c671535
          git checkout -b review/rosary-v10-nov10 8023f924125ddc41b5cf6f843bef4f695c671535
          test -z "$(git status --porcelain)"
          cp sitemap.xml /tmp/current-sitemap.xml
          git show cf1cf38ee9203f91b68a502625659d63a94d4a24:sitemap.xml > sitemap.xml
          git apply --include=sitemap.xml /tmp/rosary-v8.patch
          cp sitemap.xml /tmp/packet-sitemap.xml
          cp /tmp/current-sitemap.xml sitemap.xml
          git apply --exclude='locales/*/saint-of-day.json' --exclude='locales/saint-of-day.json' --exclude='same-page-manifest.js' --exclude='search-index/*.json' --exclude='sitemap.xml' /tmp/rosary-v8.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          current=Path('sitemap.xml').read_text()
          packet=Path('/tmp/packet-sitemap.xml').read_text()
          entries=re.findall(r'<url>.*?</url>',packet,re.S)
          urls=set(re.findall(r'<loc>(.*?)</loc>',current))
          additions=[e for e in entries if re.search(r'<loc>(.*?)</loc>',e).group(1) not in urls]
          assert len(additions)==240, len(additions)
          Path('sitemap.xml').write_text(current.replace('</urlset>','\n'.join(additions)+'\n</urlset>'))
          PY
          git restore --source=8023f924125ddc41b5cf6f843bef4f695c671535 scripts/qa/check_i18n_policy.py scripts/qa/test_i18n.py
          echo '' | base64 -d | gzip -dc > /tmp/v9-qa.patch
          echo '2c2d9585c5d41c8e4ec69c62800394b5182e8cf3b5d503977207e375c75f15dd  /tmp/v9-qa.patch' | sha256sum --check
          git apply /tmp/v9-qa.patch
          echo '' | base64 -d | gzip -dc > /tmp/v10-css.patch
          echo 'b2d714e84f69d64be5ac2adb1cd75d2714ec5358b03e746c58a620ca0d32cc46  /tmp/v10-css.patch' | sha256sum --check
          git apply /tmp/v10-css.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: pip install -r scripts/qa/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Normal generators to fixpoint
        run: |
          set -euo pipefail
          node scripts/books/pages.mjs build
          node scripts/books/shelf.mjs build
          node scripts/build-pages.mjs
          python3 scripts/build-international.py
          python3 scripts/build-international.py
          node scripts/books/build-api.mjs
          node scripts/build-search-index.mjs
          python3 scripts/sitemap_lastmod.py --baseline 8023f924125ddc41b5cf6f843bef4f695c671535
          git add -A
          git commit -m 'content: localized Rosary decade books on current stage'
          git rev-parse HEAD HEAD^{tree}
      - name: Negative generated-file scope tests
        run: PYTHONPATH=scripts/qa python3 -m unittest scripts.qa.test_i18n.RosaryGeneratedExemptionTests
      - name: Real new-page locale gate
        run: python3 scripts/qa/check_new_page_locales.py --base 8023f924125ddc41b5cf6f843bef4f695c671535
      - name: Full international and policy gates
        run: |
          set -euo pipefail
          python3 scripts/build-international.py --check
          python3 scripts/qa/check_i18n_policy.py
      - name: Source API shelf search and SEO freshness
        if: always()
        run: |
          set -euo pipefail
          node scripts/build-pages.mjs --check
          npm run books:check
          node scripts/build-search-index.mjs --check
          python3 scripts/sitemap_lastmod.py --check --baseline 8023f924125ddc41b5cf6f843bef4f695c671535
          git diff --exit-code
      - name: Publish review branch only after gates
        run: git push origin HEAD:refs/heads/review/rosary-v10-nov10
