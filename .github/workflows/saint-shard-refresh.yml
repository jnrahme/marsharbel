name: Saint window shard inventory refresh
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/saint-shard-refresh.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saint-current-nov10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Exact generated list update and independent completeness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fec01142215751f214ebc044bf85e6f8bf3460b7
          test -z "$(git status --porcelain)"
          echo '' | base64 -d | gzip -dc > /tmp/shards.patch
          echo 'ded2b8c4f9d23980c2c7ff9673738d3c071b1ffe370b2469494142d61304ea7b  /tmp/shards.patch' | sha256sum --check
          git apply --check /tmp/shards.patch
          git apply /tmp/shards.patch
          node scripts/ci/check_bq_shard_lists.mjs
          test "$(git diff --name-only | wc -l)" = 8
          test -z "$(git diff --name-only | grep -v '^scripts/ci/bq-shards/shard-[1-8]\.txt$' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ci/bq-shards
          git commit -m 'test: refresh complete browser shard inventory for saint window'
          git push origin HEAD:refs/heads/fix/saint-current-nov10
          git rev-parse HEAD HEAD^{tree}
