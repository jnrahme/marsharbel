name: Movie and oil generated search refresh
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/movie-oil-candidate.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/movie-oil-nov10-s907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Normal generated search refresh only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = acfb7cdd6c4499372c9a7809c9e83e63b3ac9b0e
          test -z "$(git status --porcelain)"
          node scripts/build-search-index.mjs
          node scripts/build-search-index.mjs --check
          test "$(git diff --name-only)" = search-index/en.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add search-index/en.json
          git commit -m 'build: refresh English search excerpts for movie and prayer pages'
          git push origin HEAD:refs/heads/review/movie-oil-nov10-s907
          git rev-parse HEAD HEAD^{tree}
