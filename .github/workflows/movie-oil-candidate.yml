name: Movie and oil candidate policy review
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/movie-oil-candidate.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: pip install -r scripts/qa/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Exact reviewed content and full policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = af91297e9e17eff8ca692d97e7470c528fbd8b38
          test -z "$(git status --porcelain)"
          echo '' | base64 -d | gzip -dc > /tmp/shards.patch
          echo 'f37f9dab5df6d8fe6f73d57c8051471c35eee8200ff177af86ab31e7f23cdf30  /tmp/shards.patch' | sha256sum --check
          git apply --check /tmp/shards.patch
          git apply /tmp/shards.patch
          python3 scripts/qa/check_i18n_policy.py
          node scripts/build-pages.mjs --check
          test -z "$(git diff --name-only | grep -v '^scripts/ci/bq-shards/shard-[1-8]\.txt$' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b review/movie-oil-nov10
          git add -A
          git commit -m 'content: current film status and prayer next steps'
          git push origin HEAD:refs/heads/review/movie-oil-nov10
          git rev-parse HEAD HEAD^{tree}
