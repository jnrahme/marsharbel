name: QA parser compatibility verification
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/qa-parser-compat-packet.yml]
permissions:
  contents: write
jobs:
  parser-compat:
    if: github.repository == 'jnrahme/marsharbel' && github.ref == 'refs/heads/recovery/nov10-write-route'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf1cf38ee9203f91b68a502625659d63a94d4a24
          fetch-depth: 0
      - name: Apply exact dependency compatibility fix to separate branch
        env:
          PATCH: 
        run: |
          test "$(git rev-parse HEAD)" = cf1cf38ee9203f91b68a502625659d63a94d4a24
          test -z "$(git status --porcelain)"
          printf '%s' "$PATCH" | base64 -d > "$RUNNER_TEMP/parser.patch"
          echo '027094172739e83966db31b7de7df5352d1ac3600fce5e191c8df8a782b796cd  '"$RUNNER_TEMP/parser.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/parser.patch"
          git checkout -b fix/qa-parser-compat-nov10
          git apply --index "$RUNNER_TEMP/parser.patch"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(qa): pin compatible template selector dependencies'
          git push origin HEAD:refs/heads/fix/qa-parser-compat-nov10
          git rev-parse HEAD HEAD^{tree}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: pip install -r scripts/qa/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Parser versions and saint contract regression
        run: |
          python3 --version
          pip show beautifulsoup4 soupsieve
          python3 -m unittest discover -s scripts/qa -p test_saint_of_day.py
      - name: Full unchanged policy under declared compatible dependencies
        run: python3 scripts/qa/check_i18n_policy.py
