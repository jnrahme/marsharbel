name: Saint current pack generation
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/saint-current-packet.yml]
permissions:
  contents: write
jobs:
  saint-current:
    if: github.repository == 'jnrahme/marsharbel' && github.ref == 'refs/heads/recovery/nov10-write-route'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage
          fetch-depth: 0
      - name: Clean current stage and parser compatibility prerequisite
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = af91297e9e17eff8ca692d97e7470c528fbd8b38
          grep -Fx 'soupsieve==2.10' scripts/qa/requirements.txt
          git rev-parse HEAD HEAD^{tree}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: pip install -r scripts/qa/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Apply reviewed Nov10-14 source data only
        env:
          PACKET: 
        run: |
          printf '%s' "$PACKET" | base64 -d | gzip -d > "$RUNNER_TEMP/saints.patch"
          echo '63feea04ec114775a947d40fb9e019e960c32470976c2728a0b195cfecc12851  '"$RUNNER_TEMP/saints.patch" | sha256sum -c -
          git checkout -b fix/saint-current-nov10
          git apply --check "$RUNNER_TEMP/saints.patch"
          git apply --index "$RUNNER_TEMP/saints.patch"
          test "$(git diff --cached --name-only | wc -l)" -eq 12
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: reviewed saint packs November10-14'
      - name: Generate source and normal complete projections
        run: |
          python3 scripts/build_saint_of_day.py
          node scripts/build-pages.mjs --pages=index.html
          python3 scripts/i18n/refresh_saint_home_bindings.py
          python3 scripts/i18n/refresh_saint_home_bindings.py --check
          python3 scripts/build-international.py
          python3 scripts/build-international.py
          python3 scripts/build-international.py --check
          python3 scripts/sitemap_lastmod.py
          python3 scripts/sitemap_lastmod.py --check
          git diff --check
          git diff --stat
          test -z "$(git diff --name-only -- .github scripts AGENTS.md locales/legacy-text-baseline.json locales/citation-amendment-2026-11.json locales/prayer-equivalence.json locales/travel-equivalence.json)"
          git add -- src/pages/index.html index.html ar/index.html de/index.html es/index.html fr/index.html hi/index.html it/index.html pl/index.html pt/index.html ru/index.html th/index.html locales same-page-manifest.js sitemap.xml
          git diff --cached --name-only
          git commit -m 'build: refresh all saint home projections and discovery'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/fix/saint-current-nov10
          git rev-parse HEAD HEAD^{tree}
      - name: Independent policy and source contracts
        run: |
          python3 scripts/qa/check_i18n_policy.py
          python3 -m unittest discover -s scripts/qa -p test_saint_of_day.py
          python3 -m unittest discover -s scripts/qa -p test_saint_plate.py
          node scripts/qa/test_saint_day_runtime.cjs
