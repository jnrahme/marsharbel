name: Saint November 12-19 final candidate checkpoint
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/saint-nov12-19-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c4a38d2643e962a540700b5d1db9b9bc2b7cc69
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r scripts/qa/requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply exact candidate and execute normal generators
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/stage | cut -f1)" = '5c4a38d2643e962a540700b5d1db9b9bc2b7cc69'
          test -z "$(git ls-remote origin refs/heads/content/saint-nov12-19-reviewed)"
          python3 - <<'PYDATA'
          import base64,gzip,hashlib
          from pathlib import Path
          data=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest()=='abd5560ddc80ff2180c82427a0b2a53936dfc9d6617fc32ccb269f0990459b11'
          Path('/tmp/saint.patch').write_bytes(data)
          PYDATA
          git config user.name 'jnrahme'
          git config user.email 'jnrahme@users.noreply.github.com'
          git checkout -b content/saint-nov12-19-reviewed
          git apply /tmp/saint.patch
          git add -- ar/index.html de/index.html es/index.html fr/index.html hi/index.html index.html it/index.html locales/ar/home-copy.json locales/ar/saint-of-day.json locales/de/home-copy.json locales/de/saint-of-day.json locales/en/home-bindings.json locales/en/home-copy.json locales/en/saint-of-day-copy.json locales/en/saint-of-day.json locales/es/home-copy.json locales/es/saint-of-day.json locales/fr/home-copy.json locales/fr/saint-of-day.json locales/hi/home-copy.json locales/hi/saint-of-day.json locales/it/home-copy.json locales/it/saint-of-day.json locales/pl/home-copy.json locales/pl/saint-of-day.json locales/pt/home-copy.json locales/pt/saint-of-day.json locales/ru/home-copy.json locales/ru/saint-of-day.json locales/saint-of-day.json locales/th/home-copy.json locales/th/saint-of-day.json pl/index.html pt/index.html ru/index.html same-page-manifest.js sitemap.xml src/pages/index.html th/index.html
          git commit -m 'Prepare sourced Saint calendar November 12-19 in all active home locales'
          test "$(git rev-parse HEAD^{tree})" = '9f22fcbdab137033a128fc968de082e66379dd76'
          git push origin HEAD:refs/heads/content/saint-nov12-19-reviewed
          git rev-parse HEAD HEAD^{tree}
      - name: Remaining unchanged source freshness check
        run: node scripts/build-pages.mjs --check
      - name: Remaining unchanged CSS and sitemap freshness checks
        run: |
          node scripts/build-home-css.mjs --check
          python3 scripts/sitemap_lastmod.py --check
          git diff --check 5c4a38d2643e962a540700b5d1db9b9bc2b7cc69
          test -z "$(git status --porcelain)"
      - name: Preserve candidate evidence even on failure
        if: always()
        run: |
          git diff --binary 5c4a38d2643e962a540700b5d1db9b9bc2b7cc69 > /tmp/saint-runner-final.patch
          git status --short > /tmp/saint-runner-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saint-nov12-19-candidate
          path: |
            /tmp/saint-runner-final.patch
            /tmp/saint-runner-status.txt
