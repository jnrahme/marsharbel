name: Saint clock shard routing refresh
on:
  push:
    branches: [recovery/nov10-write-route]
    paths: [.github/workflows/saint-nov12-19-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 72621309f711499d010aeb657fe3cbbb3e26767d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r scripts/qa/requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply exact generated shard refresh
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/content/saint-nov12-19-reviewed | cut -f1)" = '72621309f711499d010aeb657fe3cbbb3e26767d'
          python3 - <<'PYDATA'
          import base64,gzip,hashlib
          from pathlib import Path
          data=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest()=='554ec44de34e15300abba6da7e4fb7bc140b41f6c6117f8c55f70a60edaa0ca8'
          Path('/tmp/shards.patch').write_bytes(data)
          PYDATA
          git apply /tmp/shards.patch
          node scripts/ci/check_bq_shard_lists.mjs
          git diff --check
          git config user.name 'jnrahme'
          git config user.email 'jnrahme@users.noreply.github.com'
          git add -- scripts/ci/bq-shards
          git commit -m 'Refresh Saint clock shard identities from full test collection'
          test "$(git rev-parse HEAD^{tree})" = '11ab1962c6960a8d386ca433ffbb45e1bacb7e21'
          git push origin HEAD:refs/heads/content/saint-nov12-19-reviewed
          git rev-parse HEAD HEAD^{tree}
