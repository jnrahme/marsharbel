name: MB16 temporary manual generation
on:
  pull_request:
    types: [labeled]
permissions:
  contents: write
jobs:
  generate:
    if: >-
      github.event.label.name == 'mb16-manual-generate' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == 'jnrahme/marsharbel' &&
      github.event.pull_request.head.ref == 'fix/mb16-language-selector-20261119' &&
      github.event.pull_request.base.ref == 'stage' &&
      github.actor == 'jnrahme'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 -m pip install -r scripts/qa/requirements.txt
      - name: Unchanged mandatory builder
        run: python3 scripts/build-international.py
      - name: Validate finite generated-output allowlist and commit only those bytes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          allowed=set(json.load(open('scripts/mb16-generated-allowlist.json')))
          rows=subprocess.check_output(['git','status','--porcelain','-z']).decode().split('\0')
          changed=[]
          for row in filter(None,rows):
              status,path=row[:2],row[3:]
              if status not in {' M','??'} or path not in allowed:
                  raise SystemExit('Unexpected generator output: '+row)
              changed.append(path)
          if not changed: raise SystemExit('No generated output changed; inspect before proceeding')
          subprocess.run(['git','add','--',*changed],check=True)
          subprocess.run(['git','-c','user.name=Joey Rahme','-c','user.email=jnrahme@users.noreply.github.com','commit','-m','build: MB16 reviewed-generator output (draft only)'],check=True)
          branch='fix/mb16-language-selector-20261119'
          remote=subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          if remote != os.environ['EXPECTED_HEAD']:raise SystemExit('Draft head moved, refusing write')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          PY
