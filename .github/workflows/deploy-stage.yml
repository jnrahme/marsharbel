name: Deploy to Hostinger

on:
  push:
    branches:
      - stage

# Keep cancellation: obsolete stage work must never earn a newer SHA's receipt.
concurrency:
  group: hostinger-stage
  cancel-in-progress: true

# Uses only the token's existing read capability. No permission expansion.
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUSH_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact pushed version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Admit existing exact-SHA QA and Browser quality
        run: |
          mkdir -p "$RUNNER_TEMP/stage-admission"
          cat > "$RUNNER_TEMP/stage-admission/admission.py" <<'ADMISSION_PY'
          """Fail-closed admission for this stage push; no publication on stale evidence."""
          import collections
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time
          from urllib.parse import urlencode

          WORKFLOW_IDS = {'.github/workflows/qa.yml': 241818046, '.github/workflows/quality.yml': 361787853}
          WORKFLOWS = {
              '.github/workflows/qa.yml': ['qa-shard (%s/8)' % k for k in range(8)] + ['qa-gates', 'i18n-test', 'qa'],
              '.github/workflows/quality.yml': ['browser-quality-shard (%s)' % k for k in range(1, 9)] + ['browser-quality'],
          }
          SOURCE_PATHS = list(WORKFLOWS) + ['.github/workflows/deploy-stage.yml', 'scripts/qa/run_full_qa.sh', 'scripts/qa/verify_deployment.py']

          class Closed(Exception):
              pass

          class Pending(Closed):
              pass

          class Superseded(Closed):
              pass


          def require(condition, reason):
              if not condition:
                  raise Closed(reason)


          def positive(value):
              return type(value) is int and value > 0


          def timestamp():
              return datetime.datetime.now(datetime.timezone.utc).isoformat()


          def git(*args):
              return subprocess.check_output(['git', *args], text=True, timeout=10).strip()


          class API:
              def __init__(self, repo, deadline):
                  self.repo, self.deadline = repo, deadline

              def get(self, path):
                  require(path.startswith('/') and '\n' not in path and '"' not in path, 'invalid API path')
                  remaining = min(15, self.deadline - time.monotonic())
                  require(remaining > 0, 'API deadline exhausted')
                  token = os.environ['GH_TOKEN']
                  require('\n' not in token and '"' not in token, 'invalid read token')
                  config = '\n'.join([
                      'silent', 'show-error', 'fail', 'connect-timeout = 5',
                      'max-time = %s' % remaining,
                      'url = "https://api.github.com/repos/%s%s"' % (self.repo, path),
                      'header = "Accept: application/vnd.github+json"',
                      'header = "X-GitHub-Api-Version: 2022-11-28"',
                      'header = "Authorization: Bearer %s"' % token,
                  ])
                  try:
                      result = subprocess.run(['curl', '--config', '-'], input=config, text=True,
                                              capture_output=True, timeout=remaining + 1)
                      require(result.returncode == 0, 'GitHub read API failed: ' + path)
                      return json.loads(result.stdout)
                  except (ValueError, subprocess.TimeoutExpired):
                      raise Closed('GitHub read API malformed response or timeout: ' + path)

              def pages(self, path, key):
                  records, seen, expected = [], set(), None
                  for page in range(1, 11):
                      join = '&' if '?' in path else '?'
                      result = self.get(path + join + urlencode({'per_page': 100, 'page': page}))
                      total, rows = result.get('total_count'), result.get(key)
                      require(type(total) is int and 0 <= total < 1000, 'missing count or 1000-result truncation')
                      require(isinstance(rows, list) and len(rows) <= 100, 'malformed result page')
                      if expected is None:
                          expected = total
                      require(total == expected, 'pagination changed during read')
                      for row in rows:
                          require(isinstance(row, dict) and positive(row.get('id')), 'malformed record ID')
                          require(row['id'] not in seen, 'duplicate/conflicting API record')
                          seen.add(row['id'])
                          records.append(row)
                      require(len(records) <= expected, 'page exceeds declared total')
                      if len(records) == expected:
                          return records
                      require(len(rows) == 100, 'partial page or missing records')
                  raise Closed('pagination limit exceeded')


          def source_identity(api, repo, sha):
              require(git('rev-parse', 'HEAD') == sha, 'checkout is not the push SHA')
              commit = api.get('/commits/' + sha)
              require(commit.get('sha') == sha, 'commit API SHA mismatch')
              tree = git('rev-parse', 'HEAD^{tree}')
              require(commit.get('commit', {}).get('tree', {}).get('sha') == tree, 'commit tree mismatch')
              sources = {}
              for path in SOURCE_PATHS:
                  blob = git('rev-parse', sha + ':' + path)
                  require(git('hash-object', path) == blob, 'checkout source blob mismatch: ' + path)
                  sources[path] = {'blob': blob, 'sha256': hashlib.sha256(Path(path).read_bytes()).hexdigest()}
              return {'repo': repo, 'sha': sha, 'tree': tree, 'sources': sources}


          def current_stage(api, sha):
              head = api.get('/git/ref/heads/stage').get('object', {}).get('sha')
              require(isinstance(head, str) and re.fullmatch('[0-9a-f]{40}', head), 'unreadable stage SHA')
              if head != sha:
                  comparison = api.get('/compare/' + sha + '...' + head)
                  if comparison.get('status') == 'ahead' and type(comparison.get('ahead_by')) is int and comparison['ahead_by'] > 0:
                      raise Superseded('newer stage SHA confirmed: ' + head)
                  raise Closed('stage changed but not proven newer: ' + head)


          def run_identity(run, expected, workflow_id, path):
              require(isinstance(run, dict), 'malformed run')
              require(positive(run.get('id')) and positive(run.get('run_attempt')), 'missing run/attempt')
              require(run.get('workflow_id') == workflow_id and run.get('path') == path, 'workflow ID/path mismatch')
              require(run.get('repository', {}).get('full_name') == expected['repo'] and
                      run.get('head_repository', {}).get('full_name') == expected['repo'], 'repository/head repository mismatch')
              require(run.get('head_sha') == expected['sha'] and run.get('head_branch') == 'stage' and
                      run.get('event') == 'push', 'run SHA/branch/event mismatch')
              require(run.get('head_commit', {}).get('id') == expected['sha'] and
                      run.get('head_commit', {}).get('tree_id') == expected['tree'], 'run commit/tree mismatch')
              require(run.get('html_url') == 'https://github.com/%s/actions/runs/%s' % (expected['repo'], run['id']), 'run URL mismatch')


          def snapshot(api, expected):
              results = []
              pending = False
              for path, names in WORKFLOWS.items():
                  workflow = api.get('/actions/workflows/' + path.rsplit('/', 1)[1])
                  wid = workflow.get('id')
                  require(wid == WORKFLOW_IDS[path] and workflow.get('path') == path and workflow.get('state') == 'active', 'wrong/inactive workflow')
                  runs = api.pages('/actions/workflows/%s/runs?' % wid + urlencode({'head_sha': expected['sha']}), 'workflow_runs')
                  # Do not success-filter. PR/main/foreign records never qualify as stage runs.
                  matching = [r for r in runs if r.get('event') == 'push' and r.get('head_branch') == 'stage']
                  if not matching:
                      pending = True
                      continue
                  for run in matching:
                      run_identity(run, expected, wid, path)
                  latest = max(matching, key=lambda r: r['id'])
                  # Read current run first: old successful attempts must never hide reruns.
                  current = api.get('/actions/runs/%s' % latest['id'])
                  run_identity(current, expected, wid, path)
                  require(current['id'] == latest['id'], 'current run ID differs from selected latest run')
                  require(current['run_attempt'] >= latest['run_attempt'], 'attempt moved backwards')
                  attempt = current['run_attempt']
                  selected = api.get('/actions/runs/%s/attempts/%s' % (current['id'], attempt))
                  run_identity(selected, expected, wid, path)
                  require(selected['id'] == current['id'] and selected['run_attempt'] == attempt, 'attempt identity mismatch')
                  require((selected.get('status'), selected.get('conclusion')) ==
                          (current.get('status'), current.get('conclusion')), 'attempt changed during read')
                  if current.get('status') in ('queued', 'in_progress', 'waiting', 'requested', 'pending'):
                      pending = True
                      continue
                  require(current.get('status') == 'completed' and current.get('conclusion') == 'success', 'dependency not successful')
                  jobs = api.pages('/actions/runs/%s/attempts/%s/jobs' % (current['id'], attempt), 'jobs')
                  require(collections.Counter(j.get('name') for j in jobs) == collections.Counter(names),
                          'attempt job multiset mismatch; partial rerun requires rerun all jobs')
                  for job in jobs:
                      require(job.get('run_id') == current['id'] and job.get('run_attempt') == attempt and
                              job.get('head_sha') == expected['sha'] and job.get('head_branch') == 'stage', 'job identity mismatch')
                      require(job.get('status') == 'completed' and job.get('conclusion') == 'success', 'job not successful')
                      require(job.get('html_url') == current['html_url'] + '/job/' + str(job['id']), 'job URL mismatch')
                  results.append({'path': path, 'workflow_id': wid, 'workflow_blob': expected['sources'][path]['blob'],
                                  'run_id': current['id'], 'attempt': attempt, 'url': current['html_url'],
                                  'run_record': current, 'attempt_record': selected,
                                  'jobs': sorted(jobs, key=lambda j: j['id'])})
              if pending:
                  raise Pending('waiting for exact stage-push QA and Browser quality')
              return results


          def stable(api, expected):
              # A run ID/attempt change even to success is new evidence, never an in-place
              # mutation of the admitted record. Two reads close ordinary selection races.
              first = snapshot(api, expected)
              second = snapshot(api, expected)
              require(first == second, 'dependency run/attempt/jobs changed during admission')
              return first


          def save(path, record):
              Path(path).write_text(json.dumps(record, indent=2) + '\n')


          def main(mode, directory):
              out = Path(directory)
              out.mkdir(parents=True, exist_ok=True)
              repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['PUSH_SHA']
              require(re.fullmatch('[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo), 'invalid repository')
              require(re.fullmatch('[0-9a-f]{40}', sha), 'invalid push SHA')
              record = {'observed_at': timestamp(), 'publication': 'unverified', 'run_id': os.environ['GITHUB_RUN_ID'],
                        'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'sha': sha, 'repo': repo}
              result_path = out / ('admission.json' if mode == 'wait' else 'publication.json')
              try:
                  deadline = time.monotonic() + (2700 if mode == 'wait' else 60)
                  api = API(repo, deadline)
                  expected = source_identity(api, repo, sha)
                  record['identity'] = expected
                  if mode == 'wait':
                      while True:
                          current_stage(api, sha)
                          try:
                              record['dependencies'] = stable(api, expected)
                              break
                          except Pending as error:
                              print(str(error), flush=True)
                              require(time.monotonic() + 30 < deadline, '45-minute admission deadline exhausted')
                              time.sleep(30)
                      record['admission'] = 'success'
                      record['admitted_at'] = timestamp()
                  elif mode == 'scan':
                      admitted = json.loads((out / 'admission.json').read_text())
                      require(admitted.get('admission') == 'success' and admitted.get('identity') == expected and
                              admitted.get('run_id') == record['run_id'] and admitted.get('run_attempt') == record['run_attempt'],
                              'admission artifact identity mismatch')
                      current_stage(api, sha)
                      require(stable(api, expected) == admitted['dependencies'], 'dependencies changed before scan')
                      record['dependencies'] = admitted['dependencies']
                      # Reuse the existing selector, record EXACT scope and unchanged verifier.
                      sys.path.insert(0, str(Path('scripts/qa').resolve()))
                      from verify_deployment import frontend_files
                      scope = frontend_files(Path.cwd())
                      record['scope'] = [{'path': str(p.relative_to(Path.cwd())), 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in scope]
                      record['scan_started_at'] = timestamp()
                      save(result_path, record)
                      result = subprocess.run([sys.executable, 'scripts/qa/verify_deployment.py'], timeout=720)
                      record['scan_exit'] = result.returncode
                      record['scan_finished_at'] = timestamp()
                      api.deadline = time.monotonic() + 60
                      current_stage(api, sha)
                      require(stable(api, expected) == admitted['dependencies'], 'dependencies changed after scan')
                      require(result.returncode == 0, 'bounded verifier failed')
                      record['publication'] = 'verified-existing-scope'
                  else:
                      raise Closed('unknown mode')
                  save(result_path, record)
                  print(json.dumps({'sha': sha, 'admission': record.get('admission'), 'publication': record['publication']}), flush=True)
                  return 0
              except Exception as error:
                  record['publication'] = 'superseded/unverified' if isinstance(error, Superseded) else 'unverified'
                  record['error'] = str(error)
                  record['recorded_at'] = timestamp()
                  save(result_path, record)
                  print(record['publication'] + ': ' + str(error), flush=True)
                  return 1


          if __name__ == '__main__':
              sys.exit(main(sys.argv[1], sys.argv[2]))
          ADMISSION_PY
          python3 "$RUNNER_TEMP/stage-admission/admission.py" wait "$RUNNER_TEMP/stage-admission"

      - name: Preserve immutable admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage-admission/
          if-no-files-found: error

  verify-deployment:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUSH_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact admitted version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # This artifact comes only from this workflow run/attempt, never a PR or
      # an admitted QA/browser run. Check its code against this exact workflow.
      - name: Read this run's immutable admission
        uses: actions/download-artifact@v4
        with:
          name: stage-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage-admission/

      - name: Validate helper against exact workflow source
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path('.github/workflows/deploy-stage.yml').read_text()
          start = "cat > \"$RUNNER_TEMP/stage-admission/admission.py\" <<'ADMISSION_PY'\n"
          block = text.split(start, 1)[1].split('          ADMISSION_PY\n', 1)[0]
          expected = ''.join(line[10:] + '\n' for line in block.splitlines())
          actual = Path(os.environ['RUNNER_TEMP'], 'stage-admission/admission.py').read_text()
          if actual != expected:
              raise SystemExit('admission helper differs from exact workflow source')
          PY

      - name: Verify Hostinger serves this frontend
        run: python3 "$RUNNER_TEMP/stage-admission/admission.py" scan "$RUNNER_TEMP/stage-admission"

      - name: Preserve per-commit publication observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage-admission/*.json
          if-no-files-found: error

      - name: Summarize without relabeling cancellations
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'], 'stage-admission/publication.json')
          state = json.loads(path.read_text())['publication'] if path.exists() else 'unverified (no final record)'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Push SHA: `' + os.environ['PUSH_SHA'] + '`\n\nPublication: ' + state + '\n')
          PY
