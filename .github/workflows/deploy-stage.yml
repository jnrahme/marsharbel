name: Deploy to Hostinger

on:
  push:
    branches:
      - stage

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run QA suite
        run: npm run qa:ci

  notify-deploy:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Hostinger auto-deploys via webhook
        run: echo "QA passed. Hostinger webhook triggers auto-deploy from stage branch."
