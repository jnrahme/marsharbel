name: Deploy to Hostinger

on:
  push:
    branches:
      - stage

concurrency:
  group: hostinger-stage
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: sitemap lastmod is checked against each page's git history.
          fetch-depth: 0

      - name: Test deployment verification
        run: python3 -m unittest discover -s scripts/qa -p 'test_verify_deployment.py'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run QA suite
        run: npm run qa:ci

  verify-deployment:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pushed version
        uses: actions/checkout@v4

      - name: Verify Hostinger serves this frontend
        run: python3 scripts/qa/verify_deployment.py
