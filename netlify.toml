# PREVIEW-ONLY. Production is served by Hostinger from .htaccess (see the security headers there).
# This file only shapes Netlify PR preview deploys (.github/workflows/pr-preview.yml).
# Do not rely on it for production behavior.
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "SAMEORIGIN"
[[headers]]
for = "/submit-testimony.html"
[headers.values]
Cache-Control = "no-store"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://cdn.jsdelivr.net; frame-src https://challenges.cloudflare.com https://www.youtube-nocookie.com; connect-src 'self' https://alxccoizzksyitxvqhpv.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
[[headers]]
for = "/testimony-review.html"
[headers.values]
Cache-Control = "no-store"
X-Robots-Tag = "noindex, nofollow, noarchive"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
