[[redirects]]
from = "/.netlify/functions/submit-testimony"
to = "https://YOUR_PROJECT.supabase.co/functions/v1/submit-testimony"
status = 200
force = true
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "SAMEORIGIN"
[[headers]]
for = "/submit-testimony.html"
[headers.values]
Cache-Control = "no-store"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://cdn.jsdelivr.net; frame-src https://challenges.cloudflare.com; connect-src 'self' https://YOUR_PROJECT.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
[[headers]]
for = "/testimony-review.html"
[headers.values]
Cache-Control = "no-store"
X-Robots-Tag = "noindex, nofollow, noarchive"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
