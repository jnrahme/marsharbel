<section class="home-news home-saint-day" id="saint-of-the-day" aria-labelledby="saint-day-heading" data-saint-date="${date}">
  <div class="home-news-head"><h2 id="saint-day-heading" data-saint-key="heading">${heading}</h2><time datetime="${date}" data-saint-key="dateLabel">${dateLabel}</time></div>
  <div class="home-saint-pair">
    <a class="home-news-lead home-saint-info" href="${infoUrl}">
      <span class="home-news-meta" data-saint-key="calendar">${calendar}</span>
      <h3 class="home-news-title" data-saint-key="name">${name}</h3>
      <p class="home-news-dek" data-saint-key="story">${story}</p>
      <span class="home-news-credit" data-saint-key="provenance">${provenance}</span>
      <span class="home-news-meta" data-saint-key="infoCta">${infoCta}</span>
    </a>
    <a class="home-news-lead home-saint-book" href="${bookUrl}">
      <span class="home-news-photo"><img src="${bookImage}" alt="${bookAlt}" data-saint-alt="bookAlt" width="1672" height="941" loading="lazy" decoding="async" /></span>
      <span class="home-news-copy"><span class="home-news-title" data-saint-key="bookTitle">${bookTitle}</span><span class="home-news-dek" data-saint-key="bookDek">${bookDek}</span><span class="home-news-credit" data-saint-key="bookCredit">${bookCredit}</span><span class="home-news-meta" data-saint-key="bookCta">${bookCta}</span></span>
    </a>
  </div>
  <p class="home-saint-source"><a href="${calendarUrl}" data-saint-key="sourceLabel">${sourceLabel}</a></p>
</section>
